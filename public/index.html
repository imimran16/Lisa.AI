<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<title>Lisa AI</title>
<link rel="stylesheet" href="/lisa.css">
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><b class="logo">L</b><div><strong>Lisa AI</strong><small>AI Companion</small></div></div>
    <span class="status"><i></i> Online</span>
  </header>

  <section class="stage">
    <div class="glow"></div>
    <div class="avatar-wrap"><div class="avatar">
      <div class="hair back"></div><div class="body"></div><div class="neck"></div>
      <div class="head">
        <div class="hair front"></div>
        <i class="ear left"></i><i class="ear right"></i>
        <i class="brow b1"></i><i class="brow b2"></i>
        <i class="eye e1"><b></b></i><i class="eye e2"><b></b></i>
        <i class="nose"></i><i class="cheek c1"></i><i class="cheek c2"></i>
        <i class="mouth"><b></b></i>
      </div>
      <div class="arm left"><i></i></div><div class="arm right"></div>
    </div></div>
    <div class="intro"><h1>Hi, I'm Lisa ✨</h1><p>आप मुझसे हिंदी में बात कर सकते हैं</p></div>
  </section>

  <section id="chat" class="chat"><div class="bubble lisa">नमस्ते! बताइए, आज मैं आपकी क्या मदद करूँ?</div></section>

  <p id="voice-status">लिखकर या 🎙️ दबाकर Lisa से बात करें</p>

  <form id="composer" autocomplete="off">
    <input id="input" type="text" placeholder="यहाँ लिखिए…" enterkeyhint="send">
    <button type="button" id="mic" class="icon-btn mic" aria-label="बोलें">🎙️</button>
    <button type="submit" class="icon-btn send" aria-label="भेजें">➤</button>
  </form>

  <footer><span>Gemini AI · Hindi</span><span><button id="stop" type="button">⏹ Voice रोकें</button> · <button id="clear" type="button">Clear chat</button></span></footer>
</main>
<script src="/lisa.js"></script>
</body>
</html>
