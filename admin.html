<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Lisa Admin</title><link rel="icon" href="/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f1eaff;color:#2a1250;padding:16px}
.box{max-width:900px;margin:0 auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 24px #7c4dff22}
h1{margin:0 0 12px;font-size:24px}input,button{font:inherit}input[type=password]{padding:12px;border:1px solid #d9ccf5;border-radius:12px;width:min(320px,100%)}
button{padding:11px 18px;border:0;border-radius:12px;background:#6a35d6;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.msg{min-height:22px;font-weight:600}.err{color:#c0267a}.ok{color:#198754}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.it{position:relative;border-radius:14px;overflow:hidden;background:#eee;aspect-ratio:3/4}.it img{width:100%;height:100%;object-fit:cover;display:block}
.it b{position:absolute;left:6px;top:6px;background:#000a;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px}
.it button{position:absolute;right:6px;bottom:6px;padding:6px 12px;background:#c0267a;font-size:13px}
</style></head><body><div class="box">
<h1>Lisa Admin — Gallery</h1>
<div id="login"><div class="row"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"><button id="go">Login</button></div></div>
<div id="panel" hidden>
<p>Upload photos. When someone asks Lisa for her photo in chat, she sends a random one from the gallery.</p>
<div class="row"><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><button id="up">Upload</button></div>
<div class="msg" id="msg"></div><div class="grid" id="grid"></div></div>
<div class="msg err" id="lerr"></div></div>
<script>
const $=id=>document.getElementById(id);const BUILT=["/gallery/p1.jpg","/gallery/p2.jpg","/gallery/p3.jpg"];let pw="";
async function api(b){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pw},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||("Error "+r.status));return j}
function say(t,c){const m=$("msg");m.textContent=t;m.className="msg "+(c||"")}
async function shrink(f){const b=await createImageBitmap(f);const s=Math.min(1,1400/Math.max(b.width,b.height));const c=document.createElement("canvas");c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85)}
function tile(src,label,del){const d=document.createElement("div");d.className="it";const i=new Image();i.src=src;i.alt="";const b=document.createElement("b");b.textContent=label;d.append(i,b);if(del){const x=document.createElement("button");x.textContent="Delete";x.onclick=async()=>{if(!confirm("Delete this photo?"))return;try{await api({action:"delete",url:src});await load()}catch(e){say(e.message,"err")}};d.append(x)}return d}
async function load(){const j=await api({action:"list"});const g=$("grid");g.textContent="";BUILT.forEach(u=>g.append(tile(u,"Built-in",false)));j.photos.forEach(p=>g.append(tile(p.url,"Uploaded",true)))}
$("go").onclick=async()=>{pw=$("pw").value;$("lerr").textContent="";try{await load();$("login").hidden=true;$("panel").hidden=false}catch(e){$("lerr").textContent=e.message}};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("up").onclick=async()=>{const fs=[...$("files").files];if(!fs.length)return say("Choose photos first.","err");$("up").disabled=true;let n=0;try{for(const f of fs){say("Uploading "+(n+1)+" of "+fs.length+"...");await api({action:"upload",name:f.name,data:await shrink(f)});n++}say(n+" photo(s) uploaded.","ok");$("files").value="";await load()}catch(e){say(e.message+(n?" ("+n+" uploaded)":""),"err")}$("up").disabled=false};
</script></body></html>
